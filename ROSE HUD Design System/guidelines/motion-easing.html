rder-bottom:1px solid var(--border-subtle)"><span style="position:absolute;left:0;top:1px;width:8px;height:8px;background:var(--red-500);box-shadow:var(--glow-red-sm);animation:mv 2.6s cubic-bezier(.55,0,1,.45) infinite alternate"></span></div></div></div><div class="m" style="margin-top:14px;text-transform:none">dur-instant 80 · fast 160 · base 260 · slow 480 · slower 900 · pulse 2.4s · orbit 6–14s</div></body></html>
