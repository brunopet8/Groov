<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--bg-page);color:var(--fg-1);}.m{font:var(--type-micro);letter-spacing:var(--tracking-wide);color:var(--fg-3);text-transform:uppercase}.d{font:var(--type-data);color:var(--fg-2)}</style></head><body><div style="display:grid;grid-template-columns:120px 1fr;gap:8px 16px;align-items:baseline"><div class="m">--fg-1</div><div style="color:var(--fg-1);font:var(--type-body)">Primary text — panel body, values</div><div class="m">--fg-2</div><div style="color:var(--fg-2);font:var(--type-body)">Secondary — metadata, idle chips</div><div class="m">--fg-3</div><div style="color:var(--fg-3);font:var(--type-body)">Tertiary — tick labels, captions</div><div class="m">--fg-disabled</div><div style="color:var(--fg-disabled);font:var(--type-body)">Disabled</div><div class="m">--fg-accent</div><div style="color:var(--fg-accent);font:var(--type-body)">Accent — online, active, errors</div><div class="m">--fg-rose</div><div style="color:var(--fg-rose);font:var(--type-body)">Rosé — links, fine highlights</div></div></body></html>
