<!-- @dsCard group="Brand" viewport="700x190" name="Corner brackets + color interaction" subtitle="Signature frame motif. Hover: brackets ignite red, light follows cursor" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:20px 24px;background:var(--bg-page)}
.f{position:relative;height:130px;border:1px solid var(--border-subtle);display:grid;place-items:center;transition:var(--transition-color);overflow:hidden;--mx:50%;--my:50%;cursor:crosshair}
.f::before{content:"";position:absolute;inset:0;background:radial-gradient(160px circle at var(--mx) var(--my),var(--red-a24),transparent 70%);opacity:0;transition:opacity var(--dur-slow) var(--ease-out)}
.f:hover{border-color:var(--red-a40)}.f:hover::before{opacity:1}
.b{position:absolute;width:var(--bracket-size);height:var(--bracket-size);border-color:var(--fg-2);border-style:solid;border-width:0;transition:all var(--dur-base) var(--ease-out)}
.tl{top:-1px;left:-1px;border-top-width:1px;border-left-width:1px}.tr{top:-1px;right:-1px;border-top-width:1px;border-right-width:1px}.bl{bottom:-1px;left:-1px;border-bottom-width:1px;border-left-width:1px}.br{bottom:-1px;right:-1px;border-bottom-width:1px;border-right-width:1px}
.f:hover .b{border-color:var(--red-400);width:14px;height:14px;filter:drop-shadow(0 0 3px var(--red-500))}
.l{font:var(--type-label);letter-spacing:var(--tracking-widest);color:var(--fg-2);transition:var(--transition-color);position:relative}.f:hover .l{color:var(--fg-1)}
</style></head><body>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px">
<div class="f"><span class="b tl"></span><span class="b tr"></span><span class="b bl"></span><span class="b br"></span><span class="l">HOVER ME</span></div>
<div class="f" style="border-color:transparent"><span class="b tl"></span><span class="b tr"></span><span class="b bl"></span><span class="b br"></span><span class="l">BRACKETS ONLY</span></div>
<div class="f" style="border-color:var(--red-a40);box-shadow:var(--glow-inset-red)"><span class="b tl" style="border-color:var(--red-400)"></span><span class="b tr" style="border-color:var(--red-400)"></span><span class="b bl" style="border-color:var(--red-400)"></span><span class="b br" style="border-color:var(--red-400)"></span><span class="l" style="color:var(--fg-1)">ACTIVE</span></div>
</div>
<script>document.querySelectorAll('.f').forEach(f=>f.addEventListener('pointermove',e=>{const r=f.getBoundingClientRect();f.style.setProperty('--mx',(e.clientX-r.left)+'px');f.style.setProperty('--my',(e.clientY-r.top)+'px')}))</script>
</body></html>
