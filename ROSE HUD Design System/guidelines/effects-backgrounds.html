<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--bg-page);color:var(--fg-1);}.m{font:var(--type-micro);letter-spacing:var(--tracking-wide);color:var(--fg-3);text-transform:uppercase}.d{font:var(--type-data);color:var(--fg-2)}</style></head><body><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px"><div style="display:flex;flex-direction:column;gap:6px"><div style="height:84px;border:1px solid var(--border-subtle);background-image:var(--bg-grid);background-size:var(--bg-grid-size)"></div><span class="m" style="text-transform:none">bg-grid</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:84px;border:1px solid var(--border-subtle);background:var(--bg-scanlines)"></div><span class="m" style="text-transform:none">bg-scanlines</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:84px;border:1px solid var(--border-subtle);background:var(--grad-core)"></div><span class="m" style="text-transform:none">grad-core</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:84px;border:1px solid var(--border-subtle);background:var(--grad-vignette),var(--ink-500)"></div><span class="m" style="text-transform:none">grad-vignette</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:84px;border:1px solid var(--border-subtle);background:var(--grad-red-bar)"></div><span class="m" style="text-transform:none">grad-red-bar</span></div></div></body></html>
