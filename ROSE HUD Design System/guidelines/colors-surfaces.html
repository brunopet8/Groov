<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--bg-page);color:var(--fg-1);}.m{font:var(--type-micro);letter-spacing:var(--tracking-wide);color:var(--fg-3);text-transform:uppercase}.d{font:var(--type-data);color:var(--fg-2)}</style></head><body><div style="display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-bottom:16px"><div style="display:flex;flex-direction:column;gap:6px"><div style="height:48px;background:var(--bg-void);border:1px solid var(--border-subtle)"></div><div class="m" style="text-transform:none">bg-void</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:48px;background:var(--bg-page);border:1px solid var(--border-subtle)"></div><div class="m" style="text-transform:none">bg-page</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:48px;background:var(--surface-raised);border:1px solid var(--border-subtle)"></div><div class="m" style="text-transform:none">surface-raised</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:48px;background:var(--surface-panel-solid);border:1px solid var(--border-subtle)"></div><div class="m" style="text-transform:none">surface-panel-solid</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:48px;background:var(--surface-hover);border:1px solid var(--border-subtle)"></div><div class="m" style="text-transform:none">surface-hover</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:48px;background:var(--surface-active);border:1px solid var(--border-subtle)"></div><div class="m" style="text-transform:none">surface-active</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:48px;background:var(--surface-accent-dim);border:1px solid var(--border-subtle)"></div><div class="m" style="text-transform:none">surface-accent-dim</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:48px;background:var(--surface-rose-dim);border:1px solid var(--border-subtle)"></div><div class="m" style="text-transform:none">surface-rose-dim</div></div></div><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px"><div style="display:flex;flex-direction:column;gap:6px"><div style="height:36px;border:1px solid var(--border-subtle)"></div><div class="m" style="text-transform:none">border-subtle · 8%</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:36px;border:1px solid var(--border-default)"></div><div class="m" style="text-transform:none">border-default · 16%</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:36px;border:1px solid var(--border-strong)"></div><div class="m" style="text-transform:none">border-strong · 32%</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:36px;border:1px solid var(--border-accent)"></div><div class="m" style="text-transform:none">border-accent · red</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:36px;border:1px solid var(--border-rose)"></div><div class="m" style="text-transform:none">border-rose · rosé</div></div></div></body></html>
