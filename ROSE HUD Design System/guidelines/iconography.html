<!-- @dsCard group="Iconography" viewport="700x170" name="Icons — Lucide (substitute)" subtitle="CDN lucide-static, inlined SVG; inherits currentColor. 12–14px" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--bg-page)}.i{width:14px;height:14px;line-height:0}.i svg{width:100%;height:100%}.c{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--fg-2);transition:var(--transition-color);padding:8px 0;cursor:default}.c:hover{color:var(--red-400);filter:drop-shadow(0 0 4px var(--red-500))}.m{font:var(--type-micro);color:var(--fg-3)}</style></head><body>
<div id="g" style="display:grid;grid-template-columns:repeat(12,1fr);gap:6px"></div>
<script>
const n=['x','play','pause','mic','mic-off','camera','history','type','eraser','settings','chevron-down','chevron-right','arrow-up-right','maximize-2','minimize-2','search','send','volume-2','radio','cpu','activity','bar-chart-3','image','circle-dot'];
const g=document.getElementById('g');
n.forEach(k=>{const c=document.createElement('div');c.className='c';c.innerHTML=`<span class="i"></span><span class="m">${k}</span>`;g.appendChild(c);fetch(`https://unpkg.com/lucide-static@0.460.0/icons/${k}.svg`).then(r=>r.text()).then(t=>{c.firstChild.innerHTML=t.replace(/<!--[\s\S]*?-->/,'')})});
</script>
</body></html>
