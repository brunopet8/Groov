<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--bg-page);color:var(--fg-1);}.m{font:var(--type-micro);letter-spacing:var(--tracking-wide);color:var(--fg-3);text-transform:uppercase}.d{font:var(--type-data);color:var(--fg-2)}</style></head><body><div style="display:flex;gap:28px;align-items:center;flex-wrap:wrap"><div style="display:flex;align-items:center;gap:8px"><span style="width:6px;height:6px;border-radius:50%;background:var(--status-online);box-shadow:0 0 8px var(--status-online);animation:groov-pulse var(--dur-pulse) var(--ease-in-out) infinite"></span><span style="font:var(--type-label);letter-spacing:var(--tracking-wider);color:var(--status-online)">ONLINE</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:6px;height:6px;border-radius:50%;background:var(--status-live);box-shadow:0 0 8px var(--status-live);animation:groov-pulse var(--dur-pulse) var(--ease-in-out) infinite"></span><span style="font:var(--type-label);letter-spacing:var(--tracking-wider);color:var(--status-live)">LIVE</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:6px;height:6px;border-radius:50%;background:var(--status-idle);"></span><span style="font:var(--type-label);letter-spacing:var(--tracking-wider);color:var(--status-idle)">IDLE</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:6px;height:6px;border-radius:50%;background:var(--status-ok);"></span><span style="font:var(--type-label);letter-spacing:var(--tracking-wider);color:var(--status-ok)">OK</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:6px;height:6px;border-radius:50%;background:var(--status-warn);"></span><span style="font:var(--type-label);letter-spacing:var(--tracking-wider);color:var(--status-warn)">WARN</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:6px;height:6px;border-radius:50%;background:var(--status-error);box-shadow:0 0 8px var(--status-error);animation:groov-pulse var(--dur-pulse) var(--ease-in-out) infinite"></span><span style="font:var(--type-label);letter-spacing:var(--tracking-wider);color:var(--status-error)">ERROR</span></div></div><div class="m" style="margin-top:14px;text-transform:none">status-online · status-live · status-idle · status-ok · status-warn · status-error</div></body></html>
