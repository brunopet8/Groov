<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:18px 22px;background:var(--bg-page);overflow:hidden}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.k{font:var(--type-micro);letter-spacing:var(--tracking-wider);color:var(--fg-3);width:72px;flex:none;text-transform:uppercase}.stack{display:flex;flex-direction:column;gap:14px}</style></head><body><div id="root"></div>
<script type="text/babel">
const NSX = window.ROSEHUDDesignSystem_bed3b4;
const { Input, Select, Checkbox, Radio, Switch } = NSX;
function App(){
  const [voice,setVoice]=React.useState('Groov — warm');
  return (<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'16px 28px'}}>
    <div className="stack">
      <Input label="Query" placeholder="Ask GROOV…" icon="search" />
      <Input label="Port" mono suffix="TCP" defaultValue="8080" size="sm" />
      <Input label="API key" defaultValue="sk-•••••" error="Key rejected" mono />
    </div>
    <div className="stack">
      <Select label="Voice" size="sm" value={voice} onChange={setVoice} options={['Groov — warm','Groov — neutral','Groov — fast']} width={200} />
      <div className="row" style={{gap:18}}><Checkbox label="Show sources" defaultChecked /><Checkbox label="Pin panel" /></div>
      <Radio name="Mode" direction="row" defaultValue="voice" options={[{value:'voice',label:'Voice'},{value:'text',label:'Text'},{value:'camera',label:'Camera'}]} />
      <div className="row" style={{gap:18}}><Switch label="Mic" defaultChecked /><Switch label="Camera" /><Switch label="Locked" disabled /></div>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
