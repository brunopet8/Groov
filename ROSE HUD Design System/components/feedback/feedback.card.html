<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:18px 22px;background:var(--bg-page);overflow:hidden}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.k{font:var(--type-micro);letter-spacing:var(--tracking-wider);color:var(--fg-3);width:72px;flex:none;text-transform:uppercase}.stack{display:flex;flex-direction:column;gap:14px}</style></head><body><div id="root"></div>
<script type="text/babel">
const NSX = window.ROSEHUDDesignSystem_bed3b4;
const { Progress, StatusDot, Toast, Button } = NSX;
function App(){
  const [v,setV]=React.useState(18);
  React.useEffect(()=>{const s=[18,47,87,100];let i=0;const id=setInterval(()=>{i=(i+1)%s.length;setV(s[i]);},1800);return()=>clearInterval(id);},[]);
  const label=v<30?'Iniciando sistema...':v<60?'Carregando módulos...':v<100?'Finalizando inicialização...':'Online';
  return (<div style={{display:'grid',gridTemplateColumns:'1fr 290px',gap:24}}>
    <div className="stack" style={{gap:18}}>
      <Progress label={label} value={v} />
      <div className="row" style={{gap:16}}><Progress size="sm" value={72} showValue={false} width={140} /><Progress size="sm" indeterminate tone="rose" width={140} /></div>
      <div className="row" style={{gap:18}}><StatusDot tone="online" label="Online" bracketed /><StatusDot tone="live" label="Listening" /><StatusDot tone="idle" label="Idle" /><StatusDot tone="warn" label="Warn" /></div>
    </div>
    <div className="stack" style={{gap:8}}>
      <Toast icon="radio" title="Listening" message="Say a topic to research." tone="rose" onClose={()=>{}} />
      <Toast icon="triangle-alert" title="Source failed" message="theverge.com timed out." tone="red" onClose={()=>{}} action={<Button size="sm" variant="ghost" icon="rotate-cw">Retry</Button>} />
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
