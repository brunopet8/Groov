<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:18px 22px;background:var(--bg-page);overflow:hidden}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.k{font:var(--type-micro);letter-spacing:var(--tracking-wider);color:var(--fg-3);width:72px;flex:none;text-transform:uppercase}.stack{display:flex;flex-direction:column;gap:14px}</style></head><body><div id="root"></div>
<script type="text/babel">
const NSX = window.ROSEHUDDesignSystem_bed3b4;
const { Panel, Tabs, Dialog, CornerBrackets, Button } = NSX;
function App(){
  const [tab,setTab]=React.useState('brief');
  const [mode,setMode]=React.useState('History');
  const [open,setOpen]=React.useState(false);
  return (<div className="stack">
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
      <Panel eyebrow="Source · The Verge" meta="#A-112" onClose={()=>{}} title="Meta Quest 3S / Quest 3 — shipping">
        <p style={{margin:0,font:'var(--type-body-sm)',color:'var(--fg-2)'}}>Quest 3S launched alongside a price cut on Quest 3. Bundled titles drove the holiday spike. Hover me.</p>
      </Panel>
      <Panel active eyebrow="Now discussing" meta="#A-114" title="Hits: social, sandbox, fitness and rhythm" footer={<><span>3 sources</span><span style={{marginLeft:'auto'}}>27.15.0</span></>}>
        <p style={{margin:0,font:'var(--type-body-sm)',color:'var(--fg-2)'}}>Active panel — permanently lit.</p>
      </Panel>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'1fr auto',gap:16,alignItems:'end'}}>
      <Tabs value={tab} onChange={setTab} items={[{id:'brief',label:'Brief'},{id:'data',label:'Data',count:4},{id:'sources',label:'Sources'},{id:'media',label:'Media'}]} />
      <Tabs variant="chips" value={mode} onChange={setMode} items={['History','Text','Camera']} />
    </div>
    <div className="row" style={{gap:16}}>
      <div style={{position:'relative',width:120,height:44,display:'grid',placeItems:'center',font:'var(--type-micro)',letterSpacing:'var(--tracking-wider)',color:'var(--fg-3)'}}><CornerBrackets />BRACKETS</div>
      <div style={{position:'relative',width:120,height:44,display:'grid',placeItems:'center',font:'var(--type-micro)',letterSpacing:'var(--tracking-wider)',color:'var(--fg-1)'}}><CornerBrackets active />ACTIVE</div>
      <Button variant="secondary" size="sm" onClick={()=>setOpen(true)}>Open dialog</Button>
    </div>
    <Dialog open={open} onClose={()=>setOpen(false)} eyebrow="System" title="Clear all panels?" actions={<><Button variant="ghost" size="sm" onClick={()=>setOpen(false)}>Cancel</Button><Button size="sm" onClick={()=>setOpen(false)}>Clear</Button></>}>Removes 12 panels from the canvas. Transcript is kept.</Dialog>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
