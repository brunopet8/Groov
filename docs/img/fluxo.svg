<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-labelledby="titulo desc">
  <title id="titulo">How a request flows through Groov</title>
  <desc id="desc">Microphone, wake word, VAD and Whisper, triage, Claude Haiku or Claude Code, Qwen3-TTS, Groov window. Rose boxes run on your PC; indigo boxes use your own Claude plan or keys.</desc>
  <style>
    .caixa { stroke-width: 2; }
    .local { fill: #fff1f2; stroke: #e11d48; }
    .nuvem { fill: #eef2ff; stroke: #4f46e5; }
    .nome { font: 600 17px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #111827; text-anchor: middle; }
    .sub { font: 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #4b5563; text-anchor: middle; }
    .legenda { font: 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #4b5563; }
    .seta { fill: none; stroke: #9ca3af; stroke-width: 2; }
    .ponta { fill: #9ca3af; }
    .pulso { fill: none; stroke: #e11d48; stroke-width: 5; stroke-linecap: round; stroke-dasharray: 8 200;
             stroke-dashoffset: 8; animation: pulso 6s linear infinite; }
    .pulso.vai-nuvem { stroke: #4f46e5; }
    .p2 { animation-delay: 1s; } .p3 { animation-delay: 2s; } .p4 { animation-delay: 3s; }
    .p5 { animation-delay: 4s; } .p6 { animation-delay: 5s; }
    @keyframes pulso { 0% { stroke-dashoffset: 8; } 15% { stroke-dashoffset: -100; } 100% { stroke-dashoffset: -100; } }
    @media (prefers-color-scheme: dark) {
      .local { fill: #2a0f17; stroke: #fb7185; }
      .nuvem { fill: #1a1b3a; stroke: #818cf8; }
      .nome { fill: #f3f4f6; }
      .sub, .legenda { fill: #9ca3af; }
      .seta { stroke: #6b7280; } .ponta { fill: #6b7280; }
      .pulso { stroke: #fb7185; } .pulso.vai-nuvem { stroke: #818cf8; }
    }
    @media (prefers-reduced-motion: reduce) { .pulso { animation: none; stroke-dasharray: none; opacity: 0; } }
  </style>
  <defs>
    <marker id="ponta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="ponta" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- linha de cima: da voz à triagem -->
  <rect class="caixa local" x="20" y="40" width="190" height="72" rx="12"/>
  <text class="nome" x="115" y="72">Microphone</text>
  <text class="sub" x="115" y="94">Groov window, WebRTC</text>

  <rect class="caixa local" x="260" y="40" width="190" height="72" rx="12"/>
  <text class="nome" x="355" y="72">Wake word</text>
  <text class="sub" x="355" y="94">"Hey JARVIS" · "groov"</text>

  <rect class="caixa local" x="500" y="40" width="190" height="72" rx="12"/>
  <text class="nome" x="595" y="72">VAD + Whisper</text>
  <text class="sub" x="595" y="94">speech to text, on your GPU</text>

  <rect class="caixa local" x="740" y="40" width="200" height="72" rx="12"/>
  <text class="nome" x="840" y="72">Triage</text>
  <text class="sub" x="840" y="94">local shortcuts, then Jev</text>

  <!-- linha de baixo: da resposta à janela -->
  <rect class="caixa nuvem" x="740" y="190" width="200" height="72" rx="12"/>
  <text class="nome" x="840" y="222">Claude</text>
  <text class="sub" x="840" y="244">Haiku · Claude Code, your plan</text>

  <rect class="caixa local" x="500" y="190" width="190" height="72" rx="12"/>
  <text class="nome" x="595" y="222">Qwen3-TTS</text>
  <text class="sub" x="595" y="244">your voice, on your GPU</text>

  <rect class="caixa local" x="260" y="190" width="190" height="72" rx="12"/>
  <text class="nome" x="355" y="222">Groov window</text>
  <text class="sub" x="355" y="244">speech, panels, history</text>

  <!-- legenda -->
  <rect class="caixa local" x="24" y="196" width="18" height="18" rx="4"/>
  <text class="legenda" x="50" y="210">runs on your PC</text>
  <rect class="caixa nuvem" x="24" y="230" width="18" height="18" rx="4"/>
  <text class="legenda" x="50" y="244">your Claude plan</text>

  <!-- setas -->
  <path class="seta" d="M210,76 L258,76" marker-end="url(#ponta)"/>
  <path class="seta" d="M450,76 L498,76" marker-end="url(#ponta)"/>
  <path class="seta" d="M690,76 L738,76" marker-end="url(#ponta)"/>
  <path class="seta" d="M840,112 L840,188" marker-end="url(#ponta)"/>
  <path class="seta" d="M740,226 L692,226" marker-end="url(#ponta)"/>
  <path class="seta" d="M500,226 L452,226" marker-end="url(#ponta)"/>

  <!-- pulso que percorre as setas em ordem -->
  <path class="pulso p1" pathLength="100" d="M210,76 L258,76"/>
  <path class="pulso p2" pathLength="100" d="M450,76 L498,76"/>
  <path class="pulso p3" pathLength="100" d="M690,76 L738,76"/>
  <path class="pulso p4 vai-nuvem" pathLength="100" d="M840,112 L840,188"/>
  <path class="pulso p5 vai-nuvem" pathLength="100" d="M740,226 L692,226"/>
  <path class="pulso p6" pathLength="100" d="M500,226 L452,226"/>
</svg>
